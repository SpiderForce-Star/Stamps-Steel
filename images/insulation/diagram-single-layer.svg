<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="320" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t1 d1">
  <title id="t1">Single-layer faced metal building insulation</title>
  <desc id="d1">Cross-section: roof panel, purlins, and laminated insulation with white facing toward interior</desc>
  <rect width="720" height="320" fill="#f8fafc"/>
  <!-- Roof panel -->
  <path d="M40 70 L100 40 L160 70 L220 40 L280 70 L340 40 L400 70 L460 40 L520 70 L580 40 L640 70 L680 50 L680 90 L40 90 Z" fill="#94a3b8"/>
  <rect x="40" y="88" width="640" height="8" fill="#64748b"/>
  <!-- Purlins -->
  <g fill="#334155">
    <rect x="120" y="96" width="14" height="70"/>
    <rect x="110" y="160" width="34" height="10"/>
    <rect x="300" y="96" width="14" height="70"/>
    <rect x="290" y="160" width="34" height="10"/>
    <rect x="480" y="96" width="14" height="70"/>
    <rect x="470" y="160" width="34" height="10"/>
    <rect x="620" y="96" width="14" height="70"/>
    <rect x="610" y="160" width="34" height="10"/>
  </g>
  <!-- Insulation yellow between -->
  <rect x="134" y="100" width="166" height="58" fill="#fde68a" stroke="#f59e0b" stroke-width="1"/>
  <rect x="314" y="100" width="166" height="58" fill="#fde68a" stroke="#f59e0b" stroke-width="1"/>
  <rect x="494" y="100" width="126" height="58" fill="#fde68a" stroke="#f59e0b" stroke-width="1"/>
  <!-- White facing continuous under -->
  <rect x="100" y="170" width="554" height="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="100" y1="177" x2="654" y2="177" stroke="#e2e8f0" stroke-width="0.5" stroke-dasharray="6 4"/>
  <!-- Labels -->
  <text x="360" y="30" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="16" font-weight="700" fill="#0f172a">Common System — Single-Layer Faced Insulation</text>
  <text x="360" y="54" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#64748b">3″ R-10 · 4″ R-13 · 6″ R-19 laminated fiberglass with PSK-VR facing</text>
  <text x="360" y="82" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#475569">Metal roof panel</text>
  <text x="210" y="135" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="600" fill="#92400e">Fiberglass blanket</text>
  <text x="127" y="195" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#334155">Purlin</text>
  <text x="360" y="210" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="600" fill="#0f172a">White PSK-VR facing (interior side)</text>
  <text x="360" y="250" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#475569">Installed over / between purlins (roof) or girts (walls) · facing toward interior</text>
  <text x="360" y="280" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#64748b">Most common package for shops, barns, warehouses and light commercial PEBs</text>
</svg>
