<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 980" role="img" aria-labelledby="ft-title">
  <title id="ft-title">Common PEB rigid-frame types</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="720" height="980" fill="#f8fafc"/>
  <rect x="0" y="0" width="720" height="88" fill="#0f172a"/>
  <text x="360" y="38" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="22" font-weight="800" fill="#e0a05a">PEB Frame Types</text>
  <text x="360" y="64" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#94a3b8">Clear-span & modular rigid frames · Stamps Steel</text>

  <!-- helper for each card -->
  <!-- 1 Straight -->
  <g transform="translate(40,110)">
    <rect width="300" height="170" rx="14" fill="#fff" stroke="#e2e8f0"/>
    <text x="150" y="28" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="700" fill="#0f172a">Straight Column</text>
    <path d="M60 130 L60 70 L150 40 L240 70 L240 130" fill="none" stroke="#b87333" stroke-width="8" stroke-linejoin="round"/>
    <line x1="50" y1="130" x2="250" y2="130" stroke="#cbd5e1" stroke-width="3"/>
    <text x="150" y="155" text-anchor="middle" font-size="11" fill="#64748b" font-family="Inter,system-ui,sans-serif">Constant-depth columns · full clear span</text>
  </g>
  <!-- 2 Tapered -->
  <g transform="translate(380,110)">
    <rect width="300" height="170" rx="14" fill="#fff" stroke="#e2e8f0"/>
    <text x="150" y="28" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="700" fill="#0f172a">Tapered Column</text>
    <path d="M70 130 L55 70 L150 38 L245 70 L230 130" fill="none" stroke="#b87333" stroke-width="8" stroke-linejoin="round"/>
    <line x1="50" y1="130" x2="250" y2="130" stroke="#cbd5e1" stroke-width="3"/>
    <text x="150" y="155" text-anchor="middle" font-size="11" fill="#64748b" font-family="Inter,system-ui,sans-serif">Haunched rafters · efficient clear span</text>
  </g>
  <!-- 3 1-row modular -->
  <g transform="translate(40,300)">
    <rect width="300" height="170" rx="14" fill="#fff" stroke="#e2e8f0"/>
    <text x="150" y="28" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="700" fill="#0f172a">1-Row Modular Span</text>
    <path d="M45 130 L45 75 L150 42 L255 75 L255 130" fill="none" stroke="#b87333" stroke-width="7" stroke-linejoin="round"/>
    <line x1="150" y1="42" x2="150" y2="130" stroke="#c97b3a" stroke-width="7"/>
    <line x1="40" y1="130" x2="260" y2="130" stroke="#cbd5e1" stroke-width="3"/>
    <text x="150" y="155" text-anchor="middle" font-size="11" fill="#64748b" font-family="Inter,system-ui,sans-serif">One interior column line · wider buildings</text>
  </g>
  <!-- 4 2-row -->
  <g transform="translate(380,300)">
    <rect width="300" height="170" rx="14" fill="#fff" stroke="#e2e8f0"/>
    <text x="150" y="28" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="700" fill="#0f172a">2-Row Modular Span</text>
    <path d="M40 130 L40 78 L150 42 L260 78 L260 130" fill="none" stroke="#b87333" stroke-width="6" stroke-linejoin="round"/>
    <line x1="110" y1="55" x2="110" y2="130" stroke="#c97b3a" stroke-width="6"/>
    <line x1="190" y1="55" x2="190" y2="130" stroke="#c97b3a" stroke-width="6"/>
    <line x1="35" y1="130" x2="265" y2="130" stroke="#cbd5e1" stroke-width="3"/>
    <text x="150" y="155" text-anchor="middle" font-size="11" fill="#64748b" font-family="Inter,system-ui,sans-serif">Two interior rows · large clear bays</text>
  </g>
  <!-- 5 3-row -->
  <g transform="translate(40,490)">
    <rect width="300" height="170" rx="14" fill="#fff" stroke="#e2e8f0"/>
    <text x="150" y="28" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="700" fill="#0f172a">3-Row Modular Span</text>
    <path d="M38 130 L38 80 L150 40 L262 80 L262 130" fill="none" stroke="#b87333" stroke-width="5" stroke-linejoin="round"/>
    <line x1="95" y1="58" x2="95" y2="130" stroke="#c97b3a" stroke-width="5"/>
    <line x1="150" y1="40" x2="150" y2="130" stroke="#c97b3a" stroke-width="5"/>
    <line x1="205" y1="58" x2="205" y2="130" stroke="#c97b3a" stroke-width="5"/>
    <line x1="32" y1="130" x2="268" y2="130" stroke="#cbd5e1" stroke-width="3"/>
    <text x="150" y="155" text-anchor="middle" font-size="11" fill="#64748b" font-family="Inter,system-ui,sans-serif">Three rows · max width / multi-bay</text>
  </g>
  <!-- 6 Single slope -->
  <g transform="translate(380,490)">
    <rect width="300" height="170" rx="14" fill="#fff" stroke="#e2e8f0"/>
    <text x="150" y="28" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="700" fill="#0f172a">Single Slope</text>
    <path d="M55 130 L55 55 L245 95 L245 130" fill="none" stroke="#b87333" stroke-width="8" stroke-linejoin="round"/>
    <line x1="45" y1="130" x2="255" y2="130" stroke="#cbd5e1" stroke-width="3"/>
    <text x="150" y="155" text-anchor="middle" font-size="11" fill="#64748b" font-family="Inter,system-ui,sans-serif">One-way pitch · drainage / retail look</text>
  </g>
  <!-- 7 Lean-to -->
  <g transform="translate(40,680)">
    <rect width="640" height="170" rx="14" fill="#fff" stroke="#e2e8f0"/>
    <text x="320" y="28" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="700" fill="#0f172a">Lean-To (attached)</text>
    <!-- main building ghost -->
    <path d="M80 130 L80 70 L200 45 L320 70 L320 130" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linejoin="round"/>
    <!-- lean-to -->
    <path d="M320 100 L320 130 L520 130 L520 110 L320 70" fill="none" stroke="#b87333" stroke-width="8" stroke-linejoin="round"/>
    <line x1="70" y1="130" x2="530" y2="130" stroke="#cbd5e1" stroke-width="3"/>
    <text x="320" y="155" text-anchor="middle" font-size="12" fill="#64748b" font-family="Inter,system-ui,sans-serif">Attached side bay · shops, covered storage, equipment lean-tos</text>
  </g>
  <text x="360" y="960" text-anchor="middle" font-size="11" fill="#94a3b8" font-family="Inter,system-ui,sans-serif">Illustrative only · engineered for your loads, codes & clear-span needs</text>
</svg>
