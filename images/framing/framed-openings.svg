<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img">
  <rect width="960" height="520" fill="#f8fafc"/>
  <text x="480" y="34" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="800" fill="#0f172a">Framed Openings · Doors · Windows · Vents</text>
  <text x="480" y="56" text-anchor="middle" font-size="12" fill="#64748b" font-family="Inter,system-ui,sans-serif">Headers, jambs & trims integrated with girts and wall panels</text>

  <!-- Wall elevation -->
  <g transform="translate(60,90)">
    <rect x="0" y="0" width="840" height="320" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <!-- columns -->
    <rect x="0" y="0" width="18" height="320" fill="#b87333"/>
    <rect x="822" y="0" width="18" height="320" fill="#b87333"/>
    <!-- girts -->
    <line x1="18" y1="80" x2="822" y2="80" stroke="#dc2626" stroke-width="3"/>
    <line x1="18" y1="160" x2="822" y2="160" stroke="#dc2626" stroke-width="3"/>
    <line x1="18" y1="240" x2="822" y2="240" stroke="#dc2626" stroke-width="3"/>
    <!-- eave -->
    <rect x="0" y="-12" width="840" height="14" fill="#0ea5e9"/>

    <!-- Overhead door framed opening -->
    <rect x="80" y="100" width="200" height="220" fill="#1e293b" stroke="#f59e0b" stroke-width="4"/>
    <rect x="80" y="100" width="200" height="16" fill="#f59e0b"/>
    <text x="180" y="220" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="700" font-family="Inter,system-ui,sans-serif">OVERHEAD DOOR</text>
    <text x="180" y="240" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="Inter,system-ui,sans-serif">Header · jambs · framed opening</text>

    <!-- Walk door -->
    <rect x="340" y="180" width="70" height="140" fill="#334155" stroke="#06b6d4" stroke-width="4"/>
    <circle cx="395" cy="250" r="4" fill="#06b6d4"/>
    <text x="375" y="340" text-anchor="middle" fill="#06b6d4" font-size="12" font-weight="700" font-family="Inter,system-ui,sans-serif">WALK DOOR</text>

    <!-- Window -->
    <rect x="470" y="120" width="120" height="80" fill="#bae6fd" stroke="#a855f7" stroke-width="4"/>
    <line x1="530" y1="120" x2="530" y2="200" stroke="#a855f7" stroke-width="2"/>
    <line x1="470" y1="160" x2="590" y2="160" stroke="#a855f7" stroke-width="2"/>
    <text x="530" y="240" text-anchor="middle" fill="#a855f7" font-size="12" font-weight="700" font-family="Inter,system-ui,sans-serif">WINDOW</text>

    <!-- Wall louver / fan framed -->
    <rect x="650" y="140" width="90" height="70" fill="#475569" stroke="#22c55e" stroke-width="4" rx="4"/>
    <circle cx="695" cy="175" r="22" fill="none" stroke="#86efac" stroke-width="3"/>
    <text x="695" y="250" text-anchor="middle" fill="#22c55e" font-size="12" font-weight="700" font-family="Inter,system-ui,sans-serif">LOUVER / FAN</text>

    <!-- Ridge vent indicator on roof line -->
    <polygon points="380,-50 420,-70 460,-50" fill="#e0a05a" stroke="#b87333" stroke-width="2"/>
    <text x="420" y="-80" text-anchor="middle" fill="#b87333" font-size="12" font-weight="700" font-family="Inter,system-ui,sans-serif">RIDGE / ROOF VENT</text>
  </g>

  <text x="480" y="490" text-anchor="middle" fill="#64748b" font-size="12" font-family="Inter,system-ui,sans-serif">Openings are located in the secondary system so panels and trim finish cleanly around each unit</text>
</svg>
