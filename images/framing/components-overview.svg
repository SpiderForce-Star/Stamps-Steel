<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img">
  <rect width="960" height="620" fill="#f8fafc"/>
  <text x="480" y="36" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="20" font-weight="800" fill="#0f172a">Primary & Secondary Framing Components</text>
  <text x="480" y="58" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#64748b">Rigid frame · purlins · girts · bracing · openings</text>

  <!-- simple isometric building frame -->
  <g transform="translate(80,90)">
    <!-- slab -->
    <polygon points="120,420 420,500 780,380 480,300" fill="#e2e8f0" stroke="#cbd5e1"/>
    <!-- main frames (copper) -->
    <g stroke="#b87333" stroke-width="6" fill="none" stroke-linejoin="round">
      <!-- front frame -->
      <path d="M160 380 L160 220 L320 140 L480 220 L480 380"/>
      <!-- mid frames -->
      <path d="M280 400 L280 240 L440 160 L600 240 L600 400"/>
      <path d="M400 420 L400 260 L560 180 L720 260 L720 420"/>
    </g>
    <!-- purlins green -->
    <g stroke="#16a34a" stroke-width="3" fill="none">
      <line x1="175" y1="205" x2="295" y2="225"/>
      <line x1="295" y1="225" x2="415" y2="245"/>
      <line x1="200" y1="185" x2="320" y2="205"/>
      <line x1="320" y1="205" x2="440" y2="225"/>
      <line x1="340" y1="160" x2="460" y2="180"/>
      <line x1="460" y1="180" x2="580" y2="200"/>
      <line x1="360" y1="150" x2="480" y2="170"/>
      <line x1="480" y1="170" x2="600" y2="190"/>
      <!-- other slope -->
      <line x1="335" y1="155" x2="455" y2="175"/>
      <line x1="455" y1="175" x2="575" y2="195"/>
      <line x1="360" y1="175" x2="480" y2="195"/>
      <line x1="480" y1="195" x2="600" y2="215"/>
      <line x1="390" y1="200" x2="510" y2="220"/>
      <line x1="510" y1="220" x2="630" y2="240"/>
    </g>
    <!-- eave purlin / eave strut -->
    <line x1="160" y1="220" x2="280" y2="240" stroke="#0ea5e9" stroke-width="5"/>
    <line x1="280" y1="240" x2="400" y2="260" stroke="#0ea5e9" stroke-width="5"/>
    <line x1="480" y1="220" x2="600" y2="240" stroke="#0ea5e9" stroke-width="5"/>
    <line x1="600" y1="240" x2="720" y2="260" stroke="#0ea5e9" stroke-width="5"/>
    <!-- wall girts red -->
    <g stroke="#dc2626" stroke-width="3">
      <line x1="160" y1="280" x2="280" y2="300"/>
      <line x1="280" y1="300" x2="400" y2="320"/>
      <line x1="160" y1="330" x2="280" y2="350"/>
      <line x1="280" y1="350" x2="400" y2="370"/>
      <line x1="480" y1="280" x2="600" y2="300"/>
      <line x1="600" y1="300" x2="720" y2="320"/>
      <line x1="480" y1="330" x2="600" y2="350"/>
      <line x1="600" y1="350" x2="720" y2="370"/>
    </g>
    <!-- ridge line -->
    <line x1="320" y1="140" x2="440" y2="160" stroke="#7c3aed" stroke-width="4"/>
    <line x1="440" y1="160" x2="560" y2="180" stroke="#7c3aed" stroke-width="4"/>
    <!-- roof x bracing -->
    <line x1="200" y1="200" x2="380" y2="230" stroke="#64748b" stroke-width="1.5"/>
    <line x1="220" y1="230" x2="360" y2="175" stroke="#64748b" stroke-width="1.5"/>
    <!-- wall bracing -->
    <line x1="490" y1="230" x2="700" y2="400" stroke="#334155" stroke-width="2"/>
    <line x1="510" y1="390" x2="700" y2="250" stroke="#334155" stroke-width="2"/>
    <!-- OH door opening -->
    <rect x="220" y="300" width="90" height="100" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <!-- walk door -->
    <rect x="530" y="330" width="32" height="70" fill="none" stroke="#06b6d4" stroke-width="3"/>
    <!-- window -->
    <rect x="580" y="300" width="48" height="36" fill="none" stroke="#a855f7" stroke-width="3"/>
  </g>

  <!-- legend -->
  <g font-family="Inter,system-ui,sans-serif" font-size="12" transform="translate(40,540)">
    <rect x="0" y="0" width="880" height="60" rx="10" fill="#fff" stroke="#e2e8f0"/>
    <g transform="translate(20,22)">
      <line x1="0" y1="0" x2="24" y2="0" stroke="#b87333" stroke-width="6"/><text x="32" y="4" fill="#334155">Rigid frame (columns/rafters)</text>
      <line x1="210" y1="0" x2="234" y2="0" stroke="#16a34a" stroke-width="4"/><text x="242" y="4" fill="#334155">Purlins</text>
      <line x1="310" y1="0" x2="334" y2="0" stroke="#dc2626" stroke-width="4"/><text x="342" y="4" fill="#334155">Wall girts</text>
      <line x1="430" y1="0" x2="454" y2="0" stroke="#0ea5e9" stroke-width="5"/><text x="462" y="4" fill="#334155">Eave strut</text>
      <line x1="545" y1="0" x2="569" y2="0" stroke="#7c3aed" stroke-width="4"/><text x="577" y="4" fill="#334155">Ridge</text>
      <rect x="640" y="-8" width="16" height="14" fill="none" stroke="#f59e0b" stroke-width="2"/><text x="662" y="4" fill="#334155">Framed openings</text>
    </g>
  </g>
</svg>
