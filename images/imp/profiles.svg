<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img">
  <rect width="800" height="420" fill="#f8fafc"/>
  <text x="400" y="28" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="16" font-weight="700" fill="#0f172a">Common IMP Exterior Profiles</text>
  <!-- Flat / Plank -->
  <g transform="translate(40,60)">
    <text x="80" y="0" text-anchor="middle" font-size="12" font-weight="600" fill="#334155" font-family="Inter,system-ui,sans-serif">Flat / Plank</text>
    <rect x="0" y="20" width="160" height="28" fill="#e2e8f0" stroke="#64748b"/>
    <rect x="0" y="48" width="160" height="18" fill="#fde68a" stroke="#d97706"/>
    <rect x="0" y="66" width="160" height="10" fill="#f1f5f9" stroke="#94a3b8"/>
  </g>
  <!-- Light Mesa -->
  <g transform="translate(220,60)">
    <text x="80" y="0" text-anchor="middle" font-size="12" font-weight="600" fill="#334155" font-family="Inter,system-ui,sans-serif">Light Mesa</text>
    <path d="M0 48 L20 20 L40 48 L60 20 L80 48 L100 20 L120 48 L140 20 L160 48 L160 76 L0 76 Z" fill="#e2e8f0" stroke="#64748b"/>
    <rect x="0" y="76" width="160" height="16" fill="#fde68a" stroke="#d97706"/>
    <rect x="0" y="92" width="160" height="8" fill="#f1f5f9" stroke="#94a3b8"/>
  </g>
  <!-- Striated -->
  <g transform="translate(400,60)">
    <text x="80" y="0" text-anchor="middle" font-size="12" font-weight="600" fill="#334155" font-family="Inter,system-ui,sans-serif">Striated</text>
    <rect x="0" y="20" width="160" height="28" fill="#e2e8f0" stroke="#64748b"/>
    <g stroke="#94a3b8" stroke-width="0.8">
      <line x1="10" y1="20" x2="10" y2="48"/><line x1="20" y1="20" x2="20" y2="48"/>
      <line x1="30" y1="20" x2="30" y2="48"/><line x1="40" y1="20" x2="40" y2="48"/>
      <line x1="50" y1="20" x2="50" y2="48"/><line x1="60" y1="20" x2="60" y2="48"/>
      <line x1="70" y1="20" x2="70" y2="48"/><line x1="80" y1="20" x2="80" y2="48"/>
      <line x1="90" y1="20" x2="90" y2="48"/><line x1="100" y1="20" x2="100" y2="48"/>
      <line x1="110" y1="20" x2="110" y2="48"/><line x1="120" y1="20" x2="120" y2="48"/>
      <line x1="130" y1="20" x2="130" y2="48"/><line x1="140" y1="20" x2="140" y2="48"/>
      <line x1="150" y1="20" x2="150" y2="48"/>
    </g>
    <rect x="0" y="48" width="160" height="18" fill="#fde68a" stroke="#d97706"/>
    <rect x="0" y="66" width="160" height="10" fill="#f1f5f9" stroke="#94a3b8"/>
  </g>
  <!-- Heavy Embossed / Micro-rib -->
  <g transform="translate(580,60)">
    <text x="80" y="0" text-anchor="middle" font-size="12" font-weight="600" fill="#334155" font-family="Inter,system-ui,sans-serif">Micro-Rib / Embossed</text>
    <rect x="0" y="20" width="160" height="28" fill="#cbd5e1" stroke="#64748b"/>
    <g fill="#94a3b8" opacity="0.5">
      <rect x="5" y="24" width="3" height="20"/><rect x="15" y="24" width="3" height="20"/>
      <rect x="25" y="24" width="3" height="20"/><rect x="35" y="24" width="3" height="20"/>
      <rect x="45" y="24" width="3" height="20"/><rect x="55" y="24" width="3" height="20"/>
      <rect x="65" y="24" width="3" height="20"/><rect x="75" y="24" width="3" height="20"/>
      <rect x="85" y="24" width="3" height="20"/><rect x="95" y="24" width="3" height="20"/>
      <rect x="105" y="24" width="3" height="20"/><rect x="115" y="24" width="3" height="20"/>
      <rect x="125" y="24" width="3" height="20"/><rect x="135" y="24" width="3" height="20"/>
      <rect x="145" y="24" width="3" height="20"/>
    </g>
    <rect x="0" y="48" width="160" height="18" fill="#fde68a" stroke="#d97706"/>
    <rect x="0" y="66" width="160" height="10" fill="#f1f5f9" stroke="#94a3b8"/>
  </g>
  <!-- Standing seam roof -->
  <g transform="translate(100,200)">
    <text x="250" y="0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a" font-family="Inter,system-ui,sans-serif">Roof: Standing Seam IMP (weather-tight seamed joints)</text>
    <path d="M0 80 L0 50 L30 20 L50 20 L50 50 L100 50 L100 20 L120 20 L150 50 L150 80 Z
             M150 80 L150 50 L180 20 L200 20 L200 50 L250 50 L250 20 L270 20 L300 50 L300 80 Z
             M300 80 L300 50 L330 20 L350 20 L350 50 L400 50 L400 20 L420 20 L450 50 L450 80 Z
             M450 80 L450 50 L480 20 L500 20 L500 80 Z" fill="#94a3b8" stroke="#475569"/>
    <rect x="0" y="80" width="500" height="36" fill="#fcd34d" stroke="#d97706"/>
    <rect x="0" y="116" width="500" height="14" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="250" y="104" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e" font-family="Inter,system-ui,sans-serif">Foam core (PIR / PUR) · continuous thermal envelope</text>
    <text x="250" y="148" text-anchor="middle" font-size="11" fill="#475569" font-family="Inter,system-ui,sans-serif">White interior skin (preferred) · exterior paint finish · 26 ga typical / 24 ga optional</text>
  </g>
  <!-- High rib note -->
  <g transform="translate(40,360)">
    <text x="360" y="0" text-anchor="middle" font-size="12" fill="#64748b" font-family="Inter,system-ui,sans-serif">Also available: high-rib trapezoidal roof profiles for long-span applications</text>
  </g>
</svg>
